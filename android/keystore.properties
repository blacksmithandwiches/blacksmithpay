# Prototype signing credentials for BlacksmithPay (test-money build).
# The keystore file lives in ../../store-build/blacksmithpay-release.keystore.
# Passwords are intentionally NOT stored here or anywhere in this repo.
# To build a signed release locally, pass them on the Gradle command line:
#   ./gradlew bundleRelease -PbspStorePassword=<pw> -PbspKeyPassword=<pw>
# (Keystore filename/alias are recorded in store-build/BUILD-NOTES.md.)
bspKeyAlias=blacksmithpay
